packages:
  - 'apps/*'
  - 'packages/*'
  - 'mcp-server'
  - 'mcp-client'
minimumReleaseAge: 0
onlyBuiltDependencies:
  - esbuild
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@google/genai': false
  protobufjs: false
