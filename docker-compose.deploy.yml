# Deployment stack (Milestone 18). Runs the *published* GHCR images on a
# self-hosted Docker host, behind an operator-provided HTTPS reverse proxy.
#
#   Internet
#      |  HTTPS
#      v
#   reverse proxy / TLS termination      (operator-provided: nginx, Caddy, Traefik, …)
#      |            \
#      v             v
#   web:8080       api:4000                (both bound to 127.0.0.1 on the host)
#                    |        \
#                    v         v
#               postgres:5432  redis:6379  (compose network only — never published)
#
# Usage:
#   cp .env.production.example .env.production   # then fill in real values
#   export IMAGE_TAG=sha-<commit>                # pin a release; defaults to "latest"
#   docker compose --env-file .env.production -f docker-compose.deploy.yml pull
#   docker compose --env-file .env.production -f docker-compose.deploy.yml run --rm migrator
#   docker compose --env-file .env.production -f docker-compose.deploy.yml up -d
#
# This file NEVER builds an image and NEVER carries a secret or an unsafe
# development default. `docker-compose.prod.yml` remains the local build-and-run
# integration stack used by CI. See docs/deployment.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_service_booking_platform}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      # Required — no default. `docker compose` refuses to start without it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.production.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Private: reachable only on the compose network, never a host port.
    expose:
      - '5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ai_service_booking_platform}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist sessions / rate-limit counters across a restart (AOF).
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: `prisma migrate deploy` (committed migrations only), then exits.
  # Never resets, force-pushes, or seeds. Run it explicitly before `up`, or let
  # `api`'s depends_on pull it in.
  migrator:
    image: ghcr.io/sumit-0610/ai-service-booking-platform-migrator:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (see .env.production.example)}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/sumit-0610/ai-service-booking-platform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (see .env.production.example)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required (see .env.production.example)}
      # The browser-facing origin of the web app. The API also fails fast in
      # production if this is missing.
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required (the public HTTPS origin, e.g. https://app.example.com)}
      # HTTPS deployment: secure cookies, and trust the reverse proxy's
      # X-Forwarded-* headers so req.ip and secure-cookie handling are correct.
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
      # Optional — the AI assistant returns 503 when unset; the rest of the API
      # is unaffected.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Bound to loopback: the host's reverse proxy forwards to it; the public
    # internet cannot reach it directly.
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  web:
    image: ghcr.io/sumit-0610/ai-service-booking-platform-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # The published bundle has VITE_API_BASE_URL baked in at build time. If your
    # browser-facing API origin differs from the release default, publish a web
    # image built for it (release workflow, workflow_dispatch input) — this
    # compose file cannot change a built bundle. See docs/deployment.md.
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
