# Static SPA served by nginx-unprivileged (listens on 8080, runs as uid 101).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the fingerprinted asset bundles, never the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback — every unknown path renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not leak the nginx version.
    server_tokens off;
}
