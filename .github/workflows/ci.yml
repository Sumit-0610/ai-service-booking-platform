name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_service_booking_platform
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_service_booking_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app:app_password@localhost:5432/ai_service_booking_platform
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Prisma schema
        run: pnpm --filter @aisbp/database db:validate

      - name: Apply migrations to a clean database
        run: pnpm --filter @aisbp/database db:migrate:deploy

      - name: Seed the database
        run: pnpm --filter @aisbp/database db:seed

      - name: Unit and integration tests (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @aisbp/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          CI: 'true'

      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

  # Milestone 17 — prove the production Docker images build and the full stack
  # (PostgreSQL 16, Redis 7, one-shot migrator, API, nginx web) comes up healthy.
  # Independent of `validate`; neither weakens the other.
  docker:
    name: Docker images & stack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

      - name: Apply migrations (one-shot migrator; fails loudly here if broken)
        run: docker compose -f docker-compose.prod.yml run --rm migrator

      - name: Start the stack and wait for health
        # `api` + `web` pull in postgres, redis, and (idempotently) the migrator
        # via `depends_on`; `--wait` tracks the two long-running health checks.
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 api web

      - name: API /api/v1/health responds ok
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            http://localhost:4000/api/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Web serves the SPA shell
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            http://localhost:8080/ | grep -q 'id="root"'

      - name: Committed migrations were applied to the clean database
        run: |
          count=$(docker compose -f docker-compose.prod.yml exec -T postgres \
            psql -U app -d ai_service_booking_platform -tAc \
            "select count(*) from _prisma_migrations where finished_at is not null")
          echo "applied migrations: ${count}"
          test "${count}" -ge 2

      - name: Migrator is idempotent on re-run
        run: |
          docker compose -f docker-compose.prod.yml run --rm migrator | tee /tmp/migrate.log
          grep -q "No pending migrations to apply" /tmp/migrate.log

      - name: Stack state and logs on failure
        if: failure()
        run: |
          mkdir -p stacklogs
          docker compose -f docker-compose.prod.yml ps --all | tee stacklogs/ps.txt
          docker compose -f docker-compose.prod.yml logs --no-color --timestamps \
            | tee stacklogs/all.log

      - name: Upload stack logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-stack-logs
          path: stacklogs/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes --remove-orphans
